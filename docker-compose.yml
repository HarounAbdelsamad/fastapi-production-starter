services:
  api:
    build: .
    container_name: fastapi_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - rabbitmq

  postgres:
    image: postgres:16-alpine
    container_name: fastapi_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fastapi_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fastapi_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  celery_worker:
    build: .
    container_name: fastapi_celery_worker
    command: uv run celery -A app.worker.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
      - rabbitmq
      - postgres

  celery_beat:
    build: .
    container_name: fastapi_celery_beat
    command: uv run celery -A app.worker.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
      - rabbitmq

volumes:
  pgdata:
