[project]
name = "fastapi-production-starter"
version = "0.1.0"
description = "A production-ready FastAPI starter template with async SQLAlchemy, structured logging, and best practices baked in."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
keywords = ["fastapi", "async", "sqlalchemy", "production", "template", "starter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "authlib>=1.3.0",
    "boto3>=1.34.0",
    "fastapi[standard]>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.31.0",
    "aiomysql>=0.3.2",
    "alembic>=1.18.4",
    "celery>=5.3.0",
    "email-validator>=2.3.0",
    "fastapi-mail>=1.4.1",
    "motor>=3.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyjwt>=2.8.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "redis[hiredis]>=7.4.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "slowapi>=0.1.9",
    "typer>=0.12.0",
    # OpenTelemetry — wired in by default with noop exporter; set OTLP_ENDPOINT to export
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    "opentelemetry-instrumentation-redis>=0.46b0",
    "opentelemetry-instrumentation-celery>=0.46b0",
    "opentelemetry-instrumentation-logging>=0.46b0",
]

[project.scripts]
cli = "app.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.27",
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
]
# SAML support (requires xmlsec1 system library on Linux/Mac)
# On Ubuntu: apt-get install -y xmlsec1 libxmlsec1-dev pkg-config
# Then: uv sync --extra saml
saml = ["python3-saml>=1.16.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=50"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
