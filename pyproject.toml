[project]
name = "fastapi-production-starter"
version = "0.1.0"
description = "A production-ready FastAPI starter template with async SQLAlchemy, structured logging, and best practices baked in."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
keywords = ["fastapi", "async", "sqlalchemy", "production", "template", "starter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "authlib>=1.3.0",
    "boto3>=1.34.0",
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.46.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.31.0",
    "aiomysql>=0.2.0",
    "alembic>=1.13.0",
    "celery>=5.3.0",
    "email-validator>=2.3.0",
    "fastapi-mail>=1.4.1",
    "motor>=3.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyjwt>=2.8.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "redis[hiredis]>=5.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "slowapi>=0.1.9",
    "typer>=0.12.0",
]

[project.scripts]
cli = "app.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0.0",
    "httpx>=0.27",
    "pre-commit>=3.7.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=50"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
